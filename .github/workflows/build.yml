name: Build macOS release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: Prompt-Grid-macOS-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
