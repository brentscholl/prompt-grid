<!doctype html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Prompt Grid</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="h-full bg-slate-950 text-white selection:bg-indigo-500/30 selection:text-indigo-100">
    <div class="min-h-full">
      <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/85 backdrop-blur-xl">
        <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-6 px-7 py-5">
          <div class="flex min-w-0 items-center gap-3.5">
            <div class="brand-mark flex size-11 shrink-0 items-center justify-center rounded-xl">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" class="size-8">
                <defs>
                  <linearGradient id="grid-spectrum" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#67e8f9" />
                    <stop offset=".5" stop-color="#818cf8" />
                    <stop offset="1" stop-color="#c084fc" />
                  </linearGradient>
                </defs>
                <g stroke="url(#grid-spectrum)" stroke-width="1.4">
                  <rect x="4" y="5" width="10" height="10" rx="2.5" fill="#22d3ee" fill-opacity=".12" />
                  <rect x="4" y="18" width="10" height="10" rx="2.5" fill="#818cf8" fill-opacity=".1" />
                  <rect x="17" y="18" width="10" height="10" rx="2.5" fill="#c084fc" fill-opacity=".15" />
                  <path d="m7 8 2 2-2 2m3 0h1" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M7 22h4m-4 3h2m11-2h4" stroke-linecap="round" />
                </g>
                <path d="m23 3 1.6 4.4L29 9l-4.4 1.6L23 15l-1.6-4.4L17 9l4.4-1.6L23 3Z" fill="#a5f3fc" />
              </svg>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2.5">
                <h1 class="truncate text-lg font-semibold tracking-tight text-white">Prompt Grid</h1>
                <button id="paste-status" type="button" class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-white/5 px-2 py-1 text-[11px] font-medium text-slate-400 ring-1 ring-white/10 ring-inset focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
                  <span id="paste-status-dot" class="size-1.5 rounded-full bg-slate-500"></span>
                  <span id="paste-status-text">Checking paste access</span>
                </button>
              </div>
              <p class="mt-0.5 truncate text-sm text-slate-400">Click a card to send its prompt to Codex.</p>
            </div>
          </div>

          <button id="add-prompt-button" type="button" class="neon-action inline-flex shrink-0 cursor-pointer items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-300">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4.5">
              <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
            </svg>
            New prompt
          </button>
        </div>
      </header>

      <main class="mx-auto max-w-[1600px] px-7 py-7">
        <ul id="prompt-grid" role="list" aria-label="Saved prompts" class="grid grid-cols-[repeat(auto-fill,minmax(245px,1fr))] gap-5"></ul>
      </main>
    </div>

    <dialog id="prompt-dialog" aria-labelledby="dialog-title" class="m-auto w-full max-w-lg overflow-visible rounded-xl bg-transparent p-0 shadow-2xl outline-none">
      <form id="prompt-form" class="overflow-hidden rounded-xl bg-slate-900 shadow-2xl shadow-black/60 ring-1 ring-white/10">
        <div class="px-6 pt-6 pb-5">
          <div class="flex items-start justify-between gap-6">
            <div>
              <h2 id="dialog-title" class="text-base font-semibold text-white">New prompt</h2>
              <p class="mt-1 text-sm text-slate-400">Give the card a short name and the exact text you want to paste.</p>
            </div>
            <button id="close-dialog-button" type="button" class="-mr-1 rounded-md p-1.5 text-slate-500 hover:bg-white/5 hover:text-slate-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
              <span class="sr-only">Close</span>
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
              </svg>
            </button>
          </div>

          <div class="mt-6 space-y-5">
            <fieldset>
              <legend class="text-sm font-medium text-slate-200">Card color</legend>
              <div id="prompt-colors" class="mt-3 grid grid-cols-4 gap-2 sm:grid-cols-8"></div>
            </fieldset>
            <div>
              <label for="prompt-title" class="block text-sm font-medium text-slate-200">Name</label>
              <input id="prompt-title" name="title" type="text" required maxlength="80" autocomplete="off" placeholder="Double-check your work" class="mt-2 block w-full rounded-lg bg-white/5 px-3 py-2.5 text-sm text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-slate-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-400" />
            </div>

            <div>
              <label for="prompt-body" class="block text-sm font-medium text-slate-200">Prompt</label>
              <textarea id="prompt-body" name="body" rows="7" required placeholder="Type the exact prompt Codex should receive…" class="mt-2 block w-full resize-y rounded-lg bg-white/5 px-3 py-2.5 text-sm leading-6 text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-slate-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-400"></textarea>
            </div>
          </div>
        </div>

        <div class="border-t border-white/10 bg-slate-950/50 px-6 py-4">
          <div id="editor-actions" class="flex items-center justify-between gap-4">
            <button id="delete-prompt-button" type="button" class="hidden rounded-md px-2 py-1.5 text-sm font-semibold text-red-400 hover:bg-red-500/10 hover:text-red-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-400">Delete prompt</button>
            <div class="ml-auto flex items-center gap-3">
              <button id="cancel-dialog-button" type="button" class="rounded-lg bg-white/5 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm ring-1 ring-white/10 ring-inset hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">Cancel</button>
              <button type="submit" class="rounded-lg bg-indigo-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">Save prompt</button>
            </div>
          </div>

          <div id="delete-confirmation" class="hidden items-center justify-between gap-4">
            <p class="text-sm font-medium text-white">Delete this prompt?</p>
            <div class="ml-auto flex items-center gap-3">
              <button id="cancel-delete-button" type="button" class="rounded-lg bg-white/5 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm ring-1 ring-white/10 ring-inset hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">Keep it</button>
              <button id="confirm-delete-button" type="button" class="rounded-lg bg-red-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-400">Delete</button>
            </div>
          </div>
        </div>
      </form>
    </dialog>

    <div aria-live="polite" class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex justify-center p-6">
      <div id="toast" class="flex max-w-md translate-y-3 items-center gap-3 rounded-xl bg-slate-800 px-4 py-3 text-sm font-medium text-white opacity-0 shadow-2xl shadow-black/50 ring-1 ring-white/10 transition duration-200">
        <span id="toast-icon" class="flex size-6 shrink-0 items-center justify-center rounded-full bg-emerald-500">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4">
            <path fill-rule="evenodd" d="M16.704 5.293a1 1 0 0 1 .003 1.414l-7.25 7.28a1 1 0 0 1-1.414.003l-3.75-3.72a1 1 0 1 1 1.408-1.42l3.041 3.016 6.547-6.57a1 1 0 0 1 1.415-.003Z" clip-rule="evenodd" />
          </svg>
        </span>
        <span id="toast-message">Copied to clipboard</span>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
